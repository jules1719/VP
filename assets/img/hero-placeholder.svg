  <path d="M160 322h80M160 342h80" stroke="#F6F4EF" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <text x="200" y="465" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1F6E6C" opacity=".7">PLACEHOLDER – replace with product photo</text>
