<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="t">
  <title id="t">Placeholder: a bottle in a silicone sleeve standing on the round HydroSip scale base with a soft glowing ring</title>
  <defs>
