  </defs>
  <circle cx="200" cy="240" r="190" fill="#DCEBE8" opacity=".55"/>
  <ellipse cx="200" cy="420" rx="170" ry="38" fill="url(#glow)"/>
  <!-- base -->
  <ellipse cx="200" cy="412" rx="120" ry="24" fill="#1F6E6C"/>
  <rect x="80" y="388" width="240" height="24" fill="#1F6E6C"/>
  <ellipse cx="200" cy="388" rx="120" ry="24" fill="#2E8C8A"/>
  <ellipse cx="200" cy="388" rx="104" ry="18" fill="none" stroke="#BFF5EC" stroke-width="4" opacity=".9"/>
  <!-- bottle -->
  <rect x="150" y="70" width="100" height="320" rx="34" fill="url(#bottle)" stroke="#B9D6D1" stroke-width="2"/>
  <rect x="152" y="210" width="96" height="178" rx="30" fill="url(#water)" opacity=".8"/>
  <rect x="172" y="42" width="56" height="36" rx="10" fill="#1F2A2E" opacity=".85"/>
  <!-- sleeve -->
