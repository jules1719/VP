<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="t">
  <title id="t">Placeholder: a bottle in a silicone sleeve standing on the round HydroSip scale base with a soft glowing ring</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#65BDE8" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#65BDE8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" x2="1">
      <stop offset="0%" stop-color="#EAF5FC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFE6F4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9D6EE"/>
      <stop offset="100%" stop-color="#65BDE8"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="240" r="190" fill="#E3F2FB" opacity=".55"/>
  <ellipse cx="200" cy="420" rx="170" ry="38" fill="url(#glow)"/>
  <!-- base -->
  <ellipse cx="200" cy="412" rx="120" ry="24" fill="#173E65"/>
  <rect x="80" y="388" width="240" height="24" fill="#173E65"/>
  <ellipse cx="200" cy="388" rx="120" ry="24" fill="#65BDE8"/>
  <ellipse cx="200" cy="388" rx="104" ry="18" fill="none" stroke="#BFE6F8" stroke-width="4" opacity=".9"/>
  <!-- bottle -->
  <rect x="150" y="70" width="100" height="320" rx="34" fill="url(#bottle)" stroke="#B5D7EC" stroke-width="2"/>
  <rect x="152" y="210" width="96" height="178" rx="30" fill="url(#water)" opacity=".8"/>
  <rect x="172" y="42" width="56" height="36" rx="10" fill="#12263D" opacity=".85"/>
  <!-- sleeve -->
  <rect x="144" y="300" width="112" height="90" rx="22" fill="#65BDE8" opacity=".9"/>
  <path d="M160 322h80M160 342h80" stroke="#F3F9FC" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <text x="200" y="465" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173E65" opacity=".7">PLACEHOLDER – replace with product photo</text>
</svg>
