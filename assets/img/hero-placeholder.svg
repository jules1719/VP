      <stop offset="100%" stop-color="#D3E6E2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FD1CB"/>
      <stop offset="100%" stop-color="#5FAEA8"/>
